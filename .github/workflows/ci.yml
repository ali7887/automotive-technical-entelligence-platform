# Canonical CI: mirrors the local commands documented in README.md.
# Service images/ports match docker/docker-compose.yml so tests run with
# their built-in defaults (127.0.0.1:5433/6380/6335) unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, pyright, migrations, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atip
          POSTGRES_PASSWORD: atip
          POSTGRES_DB: atip
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U atip -d atip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - "6335:6333"
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Typecheck (pyright)
        run: uv run pyright
      - name: Migrations round-trip (upgrade -> downgrade -> upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -q
      - name: E2E release smoke (live server)
        env:
          BUILD_SHA: ${{ github.sha }}
          ATIP_BOOTSTRAP_PASSWORD: e2e-smoke-password
        run: |
          # all routes but /health need auth now: provision the smoke account
          uv run python -m atip_api.cli create-user \
            --email e2e@atip.local --org "E2E Smoke" --role org_admin
          uv run uvicorn atip_api.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health/live > /dev/null && break
            sleep 1
          done
          uv run pytest tests_e2e -q
          bash ../../scripts/prod_smoke_test.sh http://127.0.0.1:8000 "$BUILD_SHA"
      - name: Server log on E2E failure
        if: failure()
        run: cat uvicorn.log || true

  web:
    name: Web (eslint, tsc, next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Production build
        run: pnpm --filter web build
